function playbackGroundAt(T){ const names=[]; PB.flights.forEach(f=>{ if(f.kind!=='ground')return;
  const e=(f.end==null)?f.start+90:f.end; if(T>=f.start&&T<=e){ if(f.instructor)names.push(f.instructor); if(f.student)names.push(f.student); } }); return names; }
// animate=true while PLAYING (people walk in/out, planes taxi); false while dragging
// the slider (a jump — snap everyone into place instantly).
function applyPlaybackAt(T, animate){
  dispatchGroundNow = playbackGroundAt(T);
  const winOf=f=>{ const s=(f.takeoff!=null?f.takeoff:f.start), e=(f.landing!=null?f.landing:(f.end!=null?f.end:s+90)); return [s,e]; };
  // ---- planes: declare each plane's flight-active + crew; stepFlight() does boarding→out→
  //      returning while PLAYING; a slider JUMP snaps them straight to the end-state. ----
  let mxIdx=0;   // distinct hangar spot per MAINTENANCE plane (not global index → no stacking)
  W.planes.forEach((p,i)=>{
    const inMx=(PB.maint||[]).includes(p.tail);
    const f = inMx?null: PB.flights.find(x=>{ if(x.kind!=='flight'||x.tail!==p.tail) return false; const [s,e]=winOf(x); return T>=s&&T<=e; });
    const home=W.parkSlots[i%W.parkSlots.length]; p.homeX=home.x; p.homeY=home.y; p.boardTile={x:home.x+1,y:home.y+4};
    p.outSlot=W.outSlots[i%W.outSlots.length];
    p.crewNames = f ? [f.instructor,f.student].filter(Boolean) : [];
    if(inMx){ p.wantOut=false; p.mxSlot=W.mxSlots[mxIdx++ % W.mxSlots.length];
      if(!animate){ p.state='maintenance'; p.dispX=p.mxSlot.x; p.dispY=p.mxSlot.y; p.route=[]; }
      else if(p.state!=='maintenance'){ const prev=p.state; p.state='maintenance'; p.tx=p.mxSlot.x; p.ty=p.mxSlot.y; p.route=taxiRoute(prev,'maintenance',p,p.mxSlot); p.rSeg=0; p.usingBay=true; }
      else if(p.tx!==p.mxSlot.x || p.ty!==p.mxSlot.y){ p.tx=p.mxSlot.x; p.ty=p.mxSlot.y; p.route=[]; }
    } else { p.wantOut = !!f;
      if(!animate){                                    // jump: snap to the end-state at T
        if(f){ const s=p.outSlot||{x:RWY_CX,y:48}; p.state='out'; const q=patPos(patPhase(p)); p.dispX=q.x; p.dispY=q.y; p.tx=s.x; p.ty=s.y; p.orbA=patPhase(p); }   // airborne — joins the racetrack pattern
        else { p.state='parked'; p.dispX=home.x; p.dispY=home.y; p.tx=home.x; p.ty=home.y; }
        p.route=[];
      } else if(p.state==='maintenance'){ p.state='parked'; p.dispX=home.x; p.dispY=home.y; p.route=[]; }
    }
  });
  const flying=[];
  PB.flights.forEach(f=>{ if(f.kind!=='flight')return; const [s,e]=winOf(f);
    if(T>=s&&T<=e){ const pl=W.planes.find(p=>p.tail===f.tail); if(pl){
      if(f.instructor) flying.push({name:f.instructor,plane:pl}); if(f.student) flying.push({name:f.student,plane:pl}); } } });
  const flyOf=n=>flying.find(fi=>sameName(fi.name,n));
  // ---- who should be at the school at T: punch shift OR the span of their sessions ----
  const want=[], seen=[];
  const addWant=(name,role,base,building)=>{ if(!name||seen.some(n=>sameName(n,name)))return; seen.push(name);
    want.push({name,role,base:base||'hq-south',building:building||'South'}); };
  PB.shifts.forEach(s=>{ if(T>=s.in && (s.out==null||T<=s.out)) addWant(s.name,s.role,s.base,s.building); });
  const span={}; PB.flights.forEach(f=>{ const s=f.start,e=(f.end!=null?f.end:s+90);
    [['instructor',f.instructor],['student',f.student]].forEach(([role,nm])=>{ if(!nm)return; const k=nm.toLowerCase();
      const d=span[k]||(span[k]={display:nm,role,min:s,max:e}); d.min=Math.min(d.min,s); d.max=Math.max(d.max,e); }); });
  Object.values(span).forEach(d=>{ if(T>=d.min-10 && T<=d.max+10) addWant(d.display,d.role); });
  const inWant=n=>want.some(w=>sameName(w.name,n));
  // ---- reconcile people. During PLAY stepFlight() flies the crew; here we only make them
  //      present at school. On a JUMP we snap: airborne crew hidden, everyone else at a desk.
  want.forEach(w=>{
    let c=chars.find(x=>sameName(x.emp.name,w.name));
    if(!c){ c=new Character(makeCrewEmp(w.name,w.role)); chars.push(c); ensureTags(); }
    c.base=w.base; c.role=w.role; c.cfg=ROLES[w.role]; c.emp.building=w.building; c.emp.status='IN';
    c.flightPending=false; c.inGround=inGroundNow(c.emp.name);
    if(!animate){                                       // jump
      const fi=flyOf(w.name);
      if(fi){ c.flightPlane=fi.plane; c.state='aboard'; c.path=null; }
      else { if(c.state==='aboard'||c.state==='to_hangar') c.state='off';
        if(!c.home) c.home=c.pickHome(); c.x=c.home.x; c.y=c.home.y; c.path=null; c.punchWait=0; c.settle(); }
    } else if(c.state==='off'){ c.home=null; c.enter(false); }   // play: walk in; stepFlight takes them to fly
  });
  chars.forEach(c=>{ if(inWant(c.emp.name)||flyOf(c.emp.name)||c.state==='off') return;
    if(c.state==='aboard'||c.state==='to_hangar'){ if(c.flightPlane) c.deplane(); else c.state='off'; }
    else if(animate && !['leaving','returning'].includes(c.state)) c.leave();
    else if(!animate){ if(c.home){ releaseHome(c.base,c.home); c.home=null; } c.state='off'; c.path=null; }
  });
  renderLegend(); renderRoster(); updateKPIs();
}

// ----- PRESENCE AUTHORITY (Attendance punch + dispatch schedule) -----
// dispatchPeople: lowercased name -> { display, role, pending, flight }
//   pending = has a Planned(1)/Dispatched(2) flight OR ground today (not finished).
//   flight  = that pending session is an actual flight (not ground).
// A CFI or student is on the map if punched IN, OR they still have a pending session.
// Once everything is Completed and they're not punched in, they leave.
let dispatchPeople={};
// Fuzzy person match — Attendance often stores a shorter name than the dispatch account
// (e.g. "Eliana Sarmiento" vs "Eliana Sarmiento Marquez"). Same first name AND (same
// last token OR one is a token-prefix).
function nameTokens(n){ return String(n).toLowerCase().replace(/[^a-z\s]/g,'').trim().split(/\s+/).filter(Boolean); }
function sameName(a,b){
  const A=nameTokens(a), B=nameTokens(b); if(!A.length||!B.length) return false;
  if(A.join(' ')===B.join(' ')) return true;
  if(A[0]!==B[0]) return false;
  if(A[A.length-1]===B[B.length-1]) return true;
  const s=A.length<=B.length?A:B, l=A.length<=B.length?B:A;
  return s.every((t,i)=>t===l[i]);
}
function personPending(name){ for(const k in dispatchPeople){ if(dispatchPeople[k].pending && sameName(dispatchPeople[k].display,name)) return true; } return false; }
function personFlight(name){  for(const k in dispatchPeople){ if(dispatchPeople[k].flight  && sameName(dispatchPeople[k].display,name)) return true; } return false; }
function clientSex(first){ const w=String(first||'').toLowerCase().replace(/[^a-z]/g,'');
  return /(a|ia|elle|ette|ina|een|lyn)$/.test(w) ? 'F' : 'M'; }
function makeCrewEmp(name, role){ const parts=String(name).trim().split(/\s+/);
  return { id:'disp:'+String(name).toLowerCase(), name, first:parts[0]||name, last:parts.slice(1).join(' '),
    role: role||'student', dept: (role==='instructor'?'Instructor office HQ':'SEVIS'),
    base:'hq-south', building:'South',
    clockedIn:false, status:'FLIGHT', location:'Dispatch', lastPunch:null, sex:clientSex(parts[0]) }; }
// names currently in an active ground lesson (should be in a classroom right now)
let dispatchGroundNow=[];
function inGroundNow(name){ return dispatchGroundNow.some(n=>sameName(n, name)); }
function shouldBePresent(c){
  if(c.emp.status==='IN') return true;              // punched in
  if(personPending(c.emp.name)) return true;        // CFI/student with a planned or dispatched flight/ground
  return false;
}
function applyPresence(){
  // create synthetic chars for dispatch people (CFI/student) with a pending session, not on the roster
  for(const k in dispatchPeople){ const d=dispatchPeople[k]; if(!d.pending) continue;
    if(!chars.some(c=>sameName(c.emp.name, d.display))){
      const c=new Character(makeCrewEmp(d.display, d.role)); chars.push(c); ensureTags();
    }
  }
  chars.forEach(c=>{
    c.flightPending = personFlight(c.emp.name);       // has a pending FLIGHT (for the roster label)
    c.inGround = inGroundNow(c.emp.name);
    const want=shouldBePresent(c);
    const busy=['to_hangar','aboard','returning','leaving'].includes(c.state);   // flying/departing — don't disturb
    if(want && c.state==='off'){
      c.enter(false);
      if(c.emp.status==='IN') pushEvent(`<b>${c.emp.first}</b> clocked <span class="io-in">IN</span> · ${c.emp.building}`);
      else pushEvent(`<b>${c.emp.first}</b> <span class="io-fly">at school</span> · flight today`);
    } else if(!want && c.state!=='off' && !busy){
      c.leave();
      pushEvent(`<b>${c.emp.first}</b> <span class="io-out">left</span>`);
    }
  });
}

// Mechanics work beside each aircraft that's in the hangar for maintenance.
function placeMechanics(){
  const mx=W.planes.filter(p=>p.state==='maintenance');
  const mechs=chars.filter(c=>c.role==='mechanic' && c.state!=='off');
  mechs.forEach((m,i)=>{
    if(!mx.length) return;
    const pl=mx[i % mx.length];
    const cands=[{x:pl.tx-1,y:pl.ty+2},{x:pl.tx+3,y:pl.ty+2},{x:pl.tx-1,y:pl.ty+1},
                 {x:pl.tx+3,y:pl.ty+1},{x:pl.tx+1,y:pl.ty+4},{x:pl.tx+1,y:pl.ty-1}];
    let spot=null;
    for(const c of cands){ if(!isSolid(c.x,c.y)&&!doorAt(c.x,c.y)&&!occupied(c.x+','+c.y,m)){ spot=c; break; } }
    if(!spot) return;
    if(m.home && !(m.home.x===spot.x&&m.home.y===spot.y)) releaseHome('hangar', m.home);
    m.home={x:spot.x,y:spot.y}; m.goTo(m.home);
  });
}

// Re-pull the Attendance feed, merge, and recompute presence.
async function syncLive(){
  if(PB.on) return;                    // replay mode owns the map
  let data;
  try{ data=await DataSource.load(); }
  catch(err){ DataSource.error=String(err.message||err); renderRoster(); return; }
  const byId=new Map(chars.map(c=>[c.emp.id, c]));
  const liveIds=new Set();
  data.forEach(emp=>{
    liveIds.add(emp.id);
    let c=byId.get(emp.id);
    if(!c){
      // if a synthetic dispatch-only placeholder exists for this person, remove it first
      const si=chars.findIndex(x=>String(x.emp.id).indexOf('disp:')===0 && sameName(x.emp.name, emp.name));
      if(si>=0){ const s=chars[si]; if(s.home) releaseHome(s.base,s.home);
        if(s.tagEl) s.tagEl.remove(); if(s.bubbleEl) s.bubbleEl.remove(); chars.splice(si,1); }
      c=new Character(emp); chars.push(c); ensureTags(); return; }
    const oldBase=c.base;
    Object.assign(c.emp, emp);
    c.role=emp.role; c.cfg=ROLES[emp.role];
    // if someone already on the map changed buildings, re-home them
    if(c.state!=='off' && c.base!==emp.base && !['to_hangar','aboard','returning'].includes(c.state)){
      releaseHome(oldBase, c.home); c.home=null; c.base=emp.base;
      c.home=c.pickHome(); c.x=c.home.x; c.y=c.home.y; c.path=null; c.settle();
    } else { c.base=emp.base; }
  });
  // dropped off the Attendance feed -> no longer punched (presence recomputed below)
  chars.forEach(c=>{ if(String(c.emp.id).indexOf('disp:')!==0 && !liveIds.has(c.emp.id)){
    c.emp.status='off'; c.emp.clockedIn=false; } });
  applyPresence();                    // single authority: Attendance IN or a pending flight/ground
  placeMechanics();                   // keep mechanics at the maintenance aircraft
  renderLegend(); renderRoster(); updateSyncLabel(); updateKPIs();
}

// ---------- LIVE DISPATCH FEED (HQ flights + fleet + maintenance) ----------
const TRIMS=['#3a6ea5','#c0392b','#27ae60','#e0a800','#7d5aa8','#0f8b8d','#d35400','#5b6b8c','#b5566f','#2c9c6a','#9b59b6','#e67e22'];
let DispatchData=null;
function applyDispatchFeed(data){
  DispatchData=data;
  const list=(data.aircraft||[]).slice().sort((a,b)=>String(a.tail).localeCompare(String(b.tail)));
  const existing=new Map(W.planes.map(p=>[p.tail,p]));
  let mxIdx=0;   // hangar-bay slot counter — assign per MAINTENANCE plane (not global index) so they don't stack
  W.planes = list.map((a,i)=>{
    const home=W.parkSlots[i % W.parkSlots.length];
    const isNew = !existing.has(a.tail);
    const p=existing.get(a.tail) || {tail:a.tail, head:0, state:'parked', dispX:home.x, dispY:home.y};
    p.model=a.model; p.trim=TRIMS[i % TRIMS.length]; p.current=a.current; p.flights=a.flights;
    p.flightsToday=a.flightsToday; p.mxOverdue=a.mxOverdue;
    p.nextMx=a.nextMx; p.lastHobbs=a.lastHobbs; p.lastTach=a.lastTach;
    p.homeX=home.x; p.homeY=home.y; p.boardTile={x:home.x+1, y:home.y+4};   // crew board at the tie-down
    p.outSlot=W.outSlots[i % W.outSlots.length];
    // On a SUPERVISED SOLO the student flies alone (instructor supervises from the ground),
    // so only the student boards; a Dual flight boards both.
    p.solo = !!(a.current && a.current.solo);
    p.flightCat = (a.current && a.current.flightCat) || '';   // dual | solo | checkride
    p.crewNames = a.current ? (a.current.solo ? [a.current.student] : [a.current.instructor,a.current.student]).filter(Boolean) : [];
    if(p.dispX===undefined){ p.dispX=home.x; p.dispY=home.y; }
    if(a.state==='maintenance'){                       // maintenance taxis in via the bay (feed-driven)
      p.wantOut=false; p.dispatchOut=false; p.radarAirborne=false;
      p.mxSlot=W.mxSlots[mxIdx++ % W.mxSlots.length];  // distinct hangar spot per maintenance plane
      if(p.state!=='maintenance'){ const prev=p.state; p.state='maintenance'; p.tx=p.mxSlot.x; p.ty=p.mxSlot.y;
        if(isNew){ p.dispX=p.tx; p.dispY=p.ty; p.route=[]; } else { p.route=taxiRoute(prev,'maintenance',p,p.mxSlot); p.rSeg=0; p.usingBay=true; } }
      else if(p.tx!==p.mxSlot.x || p.ty!==p.mxSlot.y){ p.tx=p.mxSlot.x; p.ty=p.mxSlot.y; p.route=[]; }   // was stacked → glide to its own spot
    } else {
      if(p.state==='maintenance'){ p.state='returning'; p.tx=home.x; p.ty=home.y; p.route=taxiRoute('maintenance','parked',p,home); p.rSeg=0; p.usingBay=true; }
      if(isNew){ p.state='parked'; p.tx=home.x; p.ty=home.y; p.dispX=home.x; p.dispY=home.y; p.route=[]; }
      p.dispatchOut = (a.state==='out');               // checked-out on the dispatch board
      recomputeFlight(p);                              // combine with live ADS-B to decide "flying"
    }
    return p;
  });
  ensurePlaneTags();
  // build per-PERSON dispatch state (CFI or student): pending = has a Planned/Dispatched
  // flight or ground today; flight = that pending session is an actual flight (not ground).
  dispatchPeople={};
  (data.flights||[]).forEach(f=>{
    const add=(nm,role)=>{ if(!nm) return; const k=nm.toLowerCase();
      const d=dispatchPeople[k] || (dispatchPeople[k]={display:nm, role, pending:false, flight:false});
      if(f.status===1 || f.status===2){ d.pending=true; if(f.kind==='flight') d.flight=true; } };
    add(f.instructor,'instructor'); add(f.student,'student');
  });
  dispatchGroundNow = data.groundNow || [];
  applyPresence();                     // CFIs + students with a flight/ground appear even if not punched
  placeMechanics();                    // mechanics work beside each maintenance aircraft
  renderLegend(); renderRoster(); updateKPIs(); updateFlightsLabel();
}
async function loadDispatch(){
  if(PB.on) return;                    // replay mode owns the planes
  try{
    const res=await fetch('dispatch_live.php',{cache:'no-store'});
    if(!res.ok) throw new Error('dispatch HTTP '+res.status);
    const data=await res.json(); if(data.error) throw new Error(data.error);
    applyDispatchFeed(data);
  }catch(err){ pushEvent('<b>Dispatch</b> feed error — will retry'); }
}

// ---------- LIVE EVENT TICKER ----------
let tickerItems=[], tkOffset=0;
function pushEvent(html){
  tickerItems.push(html); if(tickerItems.length>14) tickerItems.shift();
  const track=document.getElementById('tk-track'); if(!track) return;
  // render items twice so the loop is seamless
  const one=tickerItems.map(t=>`<span class="tk-item">${t}</span>`).join('');
  track.innerHTML=one+one;
}
function updateTicker(dt){

// ---------- DISPATCH HANDLING ----------
function applyDispatch(d){
  if(!d) return;
  const pl=planeByTail(d.tail); if(!pl) return;
  if(d.type==='CHECKOUT'){
    const inst=charByName(d.instructor), stu=charByName(d.student);
    if(!inst||!stu){ delete DispatchSource.active[d.tail]; return; }
    pl.crew=[inst,stu]; pl.state='boarding';
    inst.goFly(pl); stu.goFly(pl);
    pushEvent(`<b>${d.tail}</b> <span class="io-fly">CHECKOUT</span> · ${d.instructor.split(' ')[0]} + ${d.student.split(' ')[0]}`);
  } else { // CHECKIN
    if(pl.state==='flying'){ pl.state='taxiing_in';
      pushEvent(`<b>${d.tail}</b> <span class="io-in">CHECKIN</span> · returning`); }
  }
}
// called by updatePlane when a returning plane finishes parking
function onPlaneParked(pl){
  (pl.crew||[]).forEach(c=>{ if(c) c.deplane(); });
  pl.crew=null; delete DispatchSource.active[pl.tail];
}
// when both crew are aboard a boarding plane, push it out
function checkBoarding(){
  W.planes.forEach(pl=>{
    if(pl.state==='boarding' && pl.crew && pl.crew.every(c=>c && c.state==='aboard')){
      stampPlaneSolid(pl,false);           // free its parking tiles
      pl.state='taxiing_out'; pl.taxiPhase=0;
    }
  });
}

function acType(m){ m=String(m||'').toUpperCase();
  if(/^PA44|SEMINOLE/.test(m)) return 'Piper Seminole';
  if(/^PA34|SENECA/.test(m))   return 'Piper Seneca';
  if(/^PA/.test(m))            return 'Piper';
  if(/^P2006/.test(m))         return 'Tecnam P2006 (twin)';
  if(/^C?152/.test(m))         return 'Cessna 152';
  if(/^C?172/.test(m))         return 'Cessna 172';

function pickAt(clientX, clientY){
  const wrap=document.getElementById('stage-wrap'); const r=wrap.getBoundingClientRect();
  const wx=(clientX-r.left+panOffX)/scale/TILE, wy=(clientY-r.top+panOffY)/scale/TILE; // tile coords
  let best=null, bd=1.4;
  chars.forEach(c=>{ if(c.state==='off'||c.state==='aboard'||!roleShown(c.role))return;
    const d=Math.hypot(c.x+0.5-wx, c.y+0.5-wy); if(d<bd){ bd=d; best={kind:'char',ref:c}; } });
  if(!best){ W.planes.forEach(p=>{ if(p.state==='flying')return;
    if(wx>=p.dispX-0.4 && wx<=p.dispX+2.4 && wy>=p.dispY-0.4 && wy<=p.dispY+4.4){ best={kind:'plane',ref:p}; } }); }
  if(!best && !PB.on){ (W.cars||[]).forEach(c=>{ if(c._x===undefined)return;
    if(wx>=c._x-0.3 && wx<=c._x+c._w+0.3 && wy>=c._y-0.3 && wy<=c._y+c._h+0.3){ best={kind:'car',ref:c}; } }); }
  if(best){ selected=best; following=false; }
}

async function loadCars(){
  try {
    const r=await fetch('cars_live.php',{cache:'no-store'}); const d=await r.json();
    const now=performance.now(), first=!W._carsLoadedOnce;
    const prev={}; (W.cars||[]).forEach(c=>prev[c.name]=c);
    const fresh=d.cars||[], used=new Set();
    // carry over each car's assigned bay + arrival animation across polls (fresh objects each fetch)
    fresh.forEach(c=>{ const o=prev[c.name]; if(o){ c._bay=o._bay; c._arriveUntil=o._arriveUntil;
      c._x=o._x;c._y=o._y;c._w=o._w;c._h=o._h; if(c._bay!=null) used.add(c._bay); } });
    // give new/bay-less cars a stable bay; a brand-new arrival drives in through the ramp entrance
    fresh.forEach(c=>{ if(c.moving) return; if(c._bay==null){ let b=0; while(used.has(b)) b++; c._bay=b; used.add(b);
      if(!first && prev[c.name]===undefined) c._arriveUntil = now + 2800; } });
    W.cars=fresh; W._carsLoadedOnce=true;
  } catch(e){ /* keep last known */ }
}
function drawCarSprite(px,py,col,horiz){
  const w = horiz ? TILE*1.5 : TILE*0.9, h = horiz ? TILE*0.9 : TILE*1.5;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(px+1,py+2,w,h);                          // shadow
  ctx.fillStyle=col; ctx.fillRect(px,py,w,h);                                           // body
  ctx.fillStyle='rgba(190,225,255,.78)';                                                // windshield
  if(horiz){ ctx.fillRect(px+2,py+2,4,h-4); } else { ctx.fillRect(px+2,py+2,w-4,4); }
  ctx.fillStyle='rgba(190,225,255,.45)';                                                // rear glass
  if(horiz){ ctx.fillRect(px+w-6,py+2,4,h-4); } else { ctx.fillRect(px+2,py+h-6,w-4,4); }
  ctx.fillStyle='rgba(255,255,255,.16)';                                                // roof
  if(horiz){ ctx.fillRect(px+8,py+3,w-15,h-6); } else { ctx.fillRect(px+3,py+8,w-6,h-15); }
  ctx.fillStyle='#0b0d12';                                                              // wheels
  if(horiz){ ctx.fillRect(px+3,py-1,4,2); ctx.fillRect(px+3,py+h-1,4,2); ctx.fillRect(px+w-7,py-1,4,2); ctx.fillRect(px+w-7,py+h-1,4,2); }
  else     { ctx.fillRect(px-1,py+3,2,4); ctx.fillRect(px+w-1,py+3,2,4); ctx.fillRect(px-1,py+h-7,2,4); ctx.fillRect(px+w-1,py+h-7,2,4); }
  return {w,h};
}
function drawCars(){

  ctx.fillStyle='#2f343d'; ctx.fillRect(LOT.x*TILE, LOT.y*TILE, LOT.w*TILE, LOT.h*TILE);
  ctx.strokeStyle='rgba(240,165,0,.55)'; ctx.lineWidth=2; ctx.strokeRect(LOT.x*TILE+1, LOT.y*TILE+1, LOT.w*TILE-2, LOT.h*TILE-2);
  ctx.strokeStyle='rgba(236,238,244,.45)'; ctx.lineWidth=1;                             // bay divider stripes
  BAY_YS.concat([BAY_YS[BAY_YS.length-1]+1.6]).forEach(by=>{
    ctx.beginPath(); ctx.moveTo((BAY_X-0.85)*TILE,(by-0.1)*TILE); ctx.lineTo((LOT.x+LOT.w)*TILE-2,(by-0.1)*TILE); ctx.stroke(); });
  ctx.fillStyle='rgba(236,238,244,.22)'; ctx.fillRect((AISLE_X-0.5)*TILE,(LOT.y+LOT.h-0.35)*TILE,TILE,3);   // entrance mark
  ctx.fillStyle='rgba(240,165,0,.85)'; ctx.font='bold 8px ui-monospace,monospace'; ctx.textAlign='left';
  ctx.fillText('PARKING', LOT.x*TILE+2, LOT.y*TILE-3);

  if(PB.on){ drawReplayCars(); return; }         // replay owns the lot — show cars per their at-base intervals

  const now=performance.now();
  (W.cars||[]).forEach(c=>{
    const col=CAR_COLORS[c.base]||'#8a93a3'; let px,py,horiz,dims,cx;
    const bayY=BAY_YS[(c._bay||0)%BAY_YS.length];
    const entX=(AISLE_X-0.45), entY=(LOT.y+LOT.h+0.3), bxT=(BAY_X-0.75);
    if(c.moving){                                       // Linxup says it's moving → cruise the aisle
      const t=((now/2600)+(String(c.name||'').length%5)*0.17)%1;
      py=((LOT.y+LOT.h-1.7)-t*(LOT.h-2.3))*TILE; px=entX*TILE; horiz=false;
    } else if(c._arriveUntil && c._arriveUntil>now){    // ARRIVING: drive in the ramp entrance → up the aisle → into the bay
      const p=1-(c._arriveUntil-now)/2800;
      if(p<0.62){ const q=p/0.62; px=entX*TILE; py=(entY+(bayY-entY)*q)*TILE; horiz=false; }   // up the aisle
      else      { const q=(p-0.62)/0.38; px=(entX+(bxT-entX)*q)*TILE; py=bayY*TILE; horiz=true; } // turn into the bay
    } else {                                            // parked nose-in against the right curb
      px=bxT*TILE; py=bayY*TILE; horiz=true;
    }
    dims=drawCarSprite(px,py,col,horiz); cx=px+dims.w/2;
    c._x=px/TILE; c._y=py/TILE; c._w=dims.w/TILE; c._h=dims.h/TILE;                      // for click hit-test
    const lbl=c.label||c.name||'Car'; ctx.font='bold 7px ui-monospace,monospace';

function spawnTrip(o){ (W.trips=W.trips||[]).push({label:o.label,color:o.color,wp:o.wp,seg:0,p:0,
  speed:o.speed||8,x:o.wp[0].x,y:o.wp[0].y,dir:0,hold:0,holdAt:o.holdAt??-1,holdMs:o.holdMs||0}); }
function updateTrips(dt){ const T=W.trips||[]; for(let i=T.length-1;i>=0;i--){ const t=T[i];
  if(t.hold>0){ t.hold-=dt*1000; continue; }
  const a=t.wp[t.seg], b=t.wp[t.seg+1]; if(!b){ T.splice(i,1); continue; }
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1; t.dir=Math.atan2(dy,dx);
  t.p += (t.speed*dt)/len;

  t.x=a.x+dx*t.p; t.y=a.y+dy*t.p; } }

function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;

    if(PB.t>=PB.max){ PB.t=PB.max; PB.playing=false; } applyPlaybackAt(PB.t, true); updatePbUI(); } }

    { const b=W.bay, cx=b.x+1;

  }
  drawFloor(); drawCars(); W.planes.forEach(drawPlane); W.desks.forEach(drawDesk);
  W.doors.forEach(drawDoor); drawBayDoor();
  [...chars].filter(c=>c.state!=='off' && c.state!=='aboard' && roleShown(c.role)).sort((a,b)=>a.y-b.y).forEach(drawChar);

function searchMatches(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const out=[];
  chars.forEach(c=>{
    const nm=(c.emp.name||'').toLowerCase(), role=(c.cfg.label||'').toLowerCase();
    if(nm.includes(q)||role.includes(q)){
      const off=c.state==='off';
      out.push({kind:'char',ref:c,off,label:c.emp.name,sub:off?'Off today':c.cfg.label,color:c.cfg.color}); }
  });
  W.planes.forEach(p=>{
    const tail=(p.tail||'').toLowerCase(), model=(p.model||'').toLowerCase(), ty=acType(p.model).toLowerCase();
    if(tail.includes(q)||model.includes(q)||ty.includes(q))
      out.push({kind:'plane',ref:p,off:false,label:p.tail||'(no tail)',sub:acType(p.model),color:p.trim||'#9aa3b2'}); });
  (W.cars||[]).forEach(c=>{
    const nm=(c.name||'').toLowerCase(), lbl=(c.label||'').toLowerCase(), base=(c.base||'').toLowerCase();
    if(nm.includes(q)||lbl.includes(q)||base.includes(q))
      out.push({kind:'car',ref:c,off:false,label:c.label||c.name||'Vehicle',sub:'Vehicle'+(c.base?(' · '+c.base):''),color:CAR_COLORS[c.base]||'#8a93a3'}); });
  // on-site people & planes first, then off people; cap the list
  out.sort((a,b)=>(a.off?1:0)-(b.off?1:0));
  return out.slice(0,8);
}

const RADAR={ on:false, data:null, sweep:0, err:false };
// Poll ADS-B continuously (even with the scope closed) so real airborne aircraft
// auto-fly on the map. Applies the snapshot to the fleet after every fetch.
async function loadRadar(){
  try{ const r=await fetch('radar.php',{cache:'no-store'}); if(!r.ok){ RADAR.err=true; return; }
    RADAR.data=await r.json(); RADAR.err=false;
  }catch(e){ RADAR.err=true; }
  applyRadarFlying();                                  // "once it appears on ADS-B, dispatch it"
}
function toggleRadar(on){
  RADAR.on = (on===undefined) ? !RADAR.on : on;
  document.getElementById('radarscope').classList.toggle('show', RADAR.on);
  document.querySelectorAll('#radar-toggle,#fs-radar').forEach(b=>b.classList.toggle('on', RADAR.on));
  if(RADAR.on) loadRadar();                            // refresh immediately when opened
}
function drawRadar(dt){
  const cv=document.getElementById('radar-canvas'); if(!cv) return; const g=cv.getContext('2d');
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2, R=W/2-16, MAXNM=80;
  g.clearRect(0,0,W,H);
  g.fillStyle='#07130d'; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
  // range rings + labels (nm)
  g.lineWidth=1.5; g.strokeStyle='rgba(6,214,160,.22)'; g.fillStyle='rgba(6,214,160,.5)'; g.font='18px ui-monospace,monospace'; g.textAlign='left';
  [20,40,60,80].forEach(nm=>{ const rr=nm/MAXNM*R; g.beginPath(); g.arc(cx,cy,rr,0,7); g.stroke(); g.fillText(nm, cx+3, cy-rr+20); });
  // crosshairs + cardinal N
  g.strokeStyle='rgba(6,214,160,.16)'; g.beginPath(); g.moveTo(cx-R,cy); g.lineTo(cx+R,cy); g.moveTo(cx,cy-R); g.lineTo(cx,cy+R); g.stroke();
  g.fillStyle='rgba(6,214,160,.85)'; g.textAlign='center'; g.font='bold 20px ui-monospace,monospace'; g.fillText('N', cx, cy-R+22);
  // sweep wedge (classic PPI)
  RADAR.sweep=(RADAR.sweep + dt*1.5) % (Math.PI*2);
  g.save(); g.translate(cx,cy); g.rotate(RADAR.sweep);
  g.fillStyle='rgba(6,214,160,.10)'; g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,-0.45,0); g.closePath(); g.fill();
  g.strokeStyle='rgba(6,214,160,.65)'; g.lineWidth=2; g.beginPath(); g.moveTo(0,0); g.lineTo(R,0); g.stroke();
  g.restore();
  // field (HQ) at centre
  g.fillStyle='#06d6a0'; g.beginPath(); g.arc(cx,cy,4,0,7); g.fill();
  // blips — our airborne fleet at real range/bearing
  const d=RADAR.data, tracked=(d&&d.tracked)||[];
  tracked.forEach(t=>{
    const rr=Math.min(1,(t.distNm||0)/MAXNM)*R, ang=(t.bearingDeg||0)*Math.PI/180;
    const x=cx+rr*Math.sin(ang), y=cy-rr*Math.cos(ang);
    if(t.track!=null){ const ta=t.track*Math.PI/180; g.strokeStyle='#06d6a0'; g.lineWidth=2;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+12*Math.sin(ta), y-12*Math.cos(ta)); g.stroke(); }
    g.fillStyle=t.onGround?'#7a8a80':'#22e39c'; g.beginPath(); g.arc(x,y,5,0,7); g.fill();
    g.textAlign='left'; g.fillStyle='#d6fff0'; g.font='bold 19px ui-monospace,monospace'; g.fillText(t.tail, x+9, y+3);
    const sub=(t.onGround?'GND':(t.altBaro!=null?(t.altBaro+'ft'):''))+(t.gs!=null?('  '+t.gs+'kt'):'');
    g.fillStyle='#86dcc2'; g.font='16px ui-monospace,monospace'; g.fillText(sub, x+9, y+22);
  });
  // caption
  const foot=document.getElementById('radar-foot');
  if(foot){
    if(RADAR.err || !d || d.source==='none'){ foot.textContent='📡 radar feed unavailable — retrying…'; }
    else { const n=tracked.length, age=Math.max(0,Math.round(Date.now()/1000-(d.generated_at||0)));
      foot.innerHTML = (n? `<b style="color:#22e39c">${n}</b> of our fleet airborne` : `no fleet aircraft transmitting`)+
        ` · ${d.countAll} contacts in ${d.rangeNm}nm · via ${d.source}${d.stale?' (cached)':''} · ${age}s ago`; }
  }
}

document.getElementById('radar-canvas').addEventListener('click',e=>{
  const cv=e.currentTarget, r=cv.getBoundingClientRect();
  const sx=(e.clientX-r.left)/r.width*cv.width, sy=(e.clientY-r.top)/r.height*cv.height;
  const cx=cv.width/2, cy=cv.height/2, R=cv.width/2-16, MAXNM=80; const d=RADAR.data; if(!d) return;
  let best=null, bd=30;
  (d.tracked||[]).forEach(t=>{ const rr=Math.min(1,(t.distNm||0)/MAXNM)*R, ang=(t.bearingDeg||0)*Math.PI/180;
    const x=cx+rr*Math.sin(ang), y=cy-rr*Math.cos(ang), dd=Math.hypot(x-sx,y-sy); if(dd<bd){ bd=dd; best=t; } });
  if(best){ const pl=W.planes.find(p=>String(p.tail).toUpperCase()===best.tail); if(pl){ selected={kind:'plane',ref:pl}; following=false; } }
});

// ---------- BOOT ----------
// portrait phones open onto a single filled band (S·H·N to move); desktop shows ALL
function pickDefaultView(){
  if(window.matchMedia('(orientation: portrait)').matches && window.innerWidth<=820) setView('south');
  else setView('all');
}
(async function boot(){
  try { await DataSource.load(); }
  catch(err){ DataSource.error=String(err.message||err);
    pushEvent('<b>Attendance</b> feed error — will retry'); }
  initGame(); renderLegend(); renderRoster(); updateSyncLabel();
  try { await loadDispatch(); } catch(err){ /* handled inside */ }
  // seed the ticker
  const c=(DispatchData&&DispatchData.counts)||{};
  ['<b>Operations HQ</b> · live from attendance + dispatch',
   `Flights today · ${c.planned||0} planned · ${c.dispatched||0} in flight · ${c.completed||0} done · ${c.maintenance||0} in MX`,
   '<b>Note</b> · Attendance presence syncs on a schedule; flights & GPS update in near real-time',
   'Attendance → people · Dispatch → aircraft · GPS → vehicles'].forEach(pushEvent);
  pickDefaultView(); resize(); updateSpeed();
  setTimeout(resize, 300); window.addEventListener('load', ()=>setTimeout(resize,100));
  requestAnimationFrame(loop);
  loadWeather();                     // live HQ METAR -> windsock + ticker + KPI
  updateKPIs();
  setInterval(syncLive, 120000);     // Attendance presence every 2 min
  setInterval(loadDispatch, 120000); // dispatch/flights every 2 min (source updates ~1 min)
  setInterval(loadWeather, 600000);  // weather every 10 min
  loadRadar();                       // live ADS-B — auto-fly aircraft that are actually airborne
  setInterval(loadRadar, 25000);     // ADS-B every 25s (cached 20s server-side)
  loadCars();                        // Linxup — company vehicles currently AT the HQ base
  setInterval(loadCars, 60000);      // vehicles every 60s
  setTimeout(()=>{ W._storiesReady=true; }, 8000);   // arm car "stories" after presence has settled
  // after the initial feeds settle, stop snapping — from here a NEW departure animates the walk-out
  setTimeout(()=>{ flightSnap=false; }, 6000);
})();
</script>
